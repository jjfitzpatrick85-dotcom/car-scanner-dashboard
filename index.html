<!DOCTYPE html>
<html>
<head>
    <title>Car Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        const API_URL = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://58b8bf13-f744-43b1-9853-e9b0085a37f3-00-17alqxf50v7s7.picard.replit.dev');
        
        async function loadVehicles() {
            try {
                const response = await fetch(API_URL + '%2Fapi%2Fvehicles');
                const data = await response.json();
                const vehicles = JSON.parse(data.contents);
                
                if (vehicles.success) {
                    displayVehicles(vehicles.vehicles);
                } else {
                    document.getElementById('app').innerHTML = '<p>Error: ' + vehicles.error + '</p>';
                }
            } catch (error) {
                document.getElementById('app').innerHTML = '<p>Connection Error: Backend may be offline</p>';
            }
        }
