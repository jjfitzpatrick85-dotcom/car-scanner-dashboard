<!DOCTYPE html>
<html>
<head>
    <title>Car Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app"></div>
    
    <script>
        const API_URL = 'https://58b8bf13-f744-43b1-9853-e9b0085a37f3-00-17alqxf50v7s7.picard.replit.dev/';
        
        async function loadVehicles() {
            try {
                const response = await fetch(API_URL + 'api/vehicles');
                const data = await response.json();
                
                if (data.success) {
                    displayVehicles(data.vehicles);
                } else {
                    document.getElementById('app').innerHTML = '<p>Error loading vehicles</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('app').innerHTML = '<p>Connection error</p>';
            }
        }
        
        function displayVehicles(vehicles) {
            const html = `
                <div class="max-w-7xl mx-auto p-6">
                    <h1 class="text-3xl font-bold mb-6">Car Scanner Pro</h1>
                    <p class="mb-6">Total Vehicles: <strong>${vehicles.length}</strong></p>
                    ${vehicles.map(v => `
                        <div class="bg-white p-6 rounded shadow mb-4">
                            <h3 class="text-xl font-bold">${v.title}</h3>
                            <p>Price: £${v.advertised_price}</p>
                            <p>Mileage: ${v.mileage} miles</p>
                            <p>Year: ${v.year}</p>
                            <p>Source: ${v.source}</p>
                            <p>Est Retail: £${v.estimated_retail}</p>
                            <p>Profit Margin: ${v.profit_margin ? v.profit_margin.toFixed(1) + '%' : 'N/A'}</p>
                            <p>Days to Sell: ${v.days_to_sell}</p>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }
        
        loadVehicles();
    </script>
</body>
</html>
