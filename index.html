<!DOCTYPE html>
<html>
<head>
    <title>Car Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root" class="p-6"></div>
    <script>
        fetch('https://58b8bf13-f744-43b1-9853-e9b0085a37f3-00-17alqxf50v7s7.picard.replit.dev/api/vehicles')
            .then(r => r.json())
            .then(data => {
                if(data.success && data.vehicles) {
                    let html = '<div class="max-w-7xl mx-auto"><h1 class="text-4xl font-bold mb-6">Car Scanner Pro</h1><p class="mb-6">Found ' + data.vehicles.length + ' vehicles</p>';
                    data.vehicles.forEach(v => {
                        html += '<div class="bg-white p-6 rounded shadow mb-4"><h3 class="text-xl font-bold">' + v.title + '</h3><p>£' + v.advertised_price + ' | ' + v.mileage + ' miles | ' + v.source + '</p><p>Est: £' + v.estimated_retail + ' | Profit: ' + (v.profit_margin ? v.profit_margin.toFixed(1) + '%' : 'N/A') + '</p></div>';
                    });
                    html += '</div>';
                    document.getElementById('root').innerHTML = html;
                }
            })
            .catch(e => document.getElementById('root').innerHTML = '<p>Connection error</p>');
    </script>
</body>
</html>
