<!DOCTYPE html>
<html>
<head>
    <title>Car Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body onload="loadData()">
    <div class="max-w-7xl mx-auto p-6">
        <h1 class="text-4xl font-bold mb-4">Car Scanner Pro</h1>
        <div id="content">Loading vehicles...</div>
    </div>
    
    <script>
        function loadData() {
            fetch('https://api.allorigins.win/get?url=https%3A%2F%2F58b8bf13-f744-43b1-9853-e9b0085a37f3-00-17alqxf50v7s7.picard.replit.dev%2Fapi%2Fvehicles')
                .then(r => r.json())
                .then(d => {
                    const vehicles = JSON.parse(d.contents);
                    let html = '<p class="mb-6">Found ' + vehicles.vehicles.length + ' vehicles</p>';
                    
                    vehicles.vehicles.forEach(v => {
                        html += '<div class="bg-white p-6 rounded shadow mb-4"><h3 class="font-bold text-lg">' + v.title + '</h3>';
                        html += '<p>£' + v.advertised_price + ' | ' + v.mileage + ' miles | ' + v.source + '</p>';
                        html += '<p>Est: £' + v.estimated_retail + ' | Profit: ' + (v.profit_margin ? v.profit_margin.toFixed(1) + '%' : 'N/A') + '</p></div>';
                    });
                    
                    document.getElementById('content').innerHTML = html;
                })
                .catch(e => {
                    document.getElementById('content').innerHTML = 'Error loading data';
                    console.error(e);
                });
        }
    </script>
</body>
</html>
